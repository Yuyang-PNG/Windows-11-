name: Build and Sign

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pystray psutil pyyaml wmi scikit-learn numpy pillow flask fastapi uvicorn

      - name: Build with PyInstaller
        run: |
          pyinstaller build_exe.spec -y

      - name: Sign executable
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: 'v2.2.4'

      - name: Sign with Sigstore
        run: |
          cosign sign-blob --output-signature sigstore.sig --output-certificate sigstore.cert "dist/智优进程管理器/智优进程管理器.exe"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: signed-executable
          path: |
            dist/智优进程管理器/智优进程管理器.exe
            sigstore.sig
            sigstore.cert