version: "1.0"
description: "进程优先级评分规则配置"
last_updated: "2026-06-10"

weights:
  cpu_weight: 25
  memory_weight: 20
  threads_weight: 10
  io_weight: 8
  uptime_weight: 7
  status_weight: 5
  type_weight: 15

category_base_scores:
  gaming: 75
  video: 55
  browser: 45
  productivity: 45
  development: 55
  design: 65
  ai: 65
  system: 50
  security: 40
  utility: 40
  communication: 42
  music: 42
  cloud: 40
  unknown: 45

process_type_bonus:
  user_app: 8
  system: 5
  service: 2
  background: -5
  unknown: 0

uptime_rules:
  - condition: "< 300"
    score: 8
    description: "新启动进程"
  - condition: "< 1800"
    score: 4
    description: "运行中进程"
  - condition: "> 86400"
    score: -5
    description: "长时间运行进程"

status_scores:
  running: 5
  sleeping: -3
  waiting: -2
  stopped: -10
  zombie: -15

cpu_calculation:
  formula: "min(weight, cpu_percent * 0.5)"

memory_calculation:
  formula: "min(weight, memory_percent * 0.4)"

threads_calculation:
  formula: "min(weight, min(threads, 50) * 0.2)"

io_calculation:
  formula: "min(weight, (io_read + io_write) / 50)"